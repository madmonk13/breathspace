<title>Breath Space</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Guided breathing meditation with 5×5, 4×6, and 4×8 patterns">
<meta name="theme-color" content="#1e6fa8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#02080f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breath Space">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400&family=Outfit:wght@100;200&display=swap">
<style>
/* === Breath Space – sky meditation canvas ===
   Layout: full-screen sky gradient, drifting clouds, centered breathing sphere */

:root {
  --sky-top:    #1e6fa8;
  --sky-mid:    #5aa8d6;
  --sky-low:    #bde0f4;
  --sph-hi:     rgba(255,255,255,0.88);
  --sph-mid:    rgba(170,218,255,0.36);
  --sph-dep:    rgba(42,120,210,0.52);
  --sph-glo:    rgba(90,175,255,0.48);
  --sph-shd:    rgba(0,55,130,0.22);
  --cloud:      rgba(255,255,255,0.68);
  --fg:         rgba(8,38,78,0.92);
  --fg2:        rgba(28,76,148,0.65);
  --fg3:        rgba(18,65,138,0.78);
  --sphere-dur: 5s;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top:    #02080f;
    --sky-mid:    #05162e;
    --sky-low:    #0b2c50;
    --sph-hi:     rgba(90,155,228,0.52);
    --sph-mid:    rgba(35,85,175,0.32);
    --sph-dep:    rgba(8,45,125,0.62);
    --sph-glo:    rgba(55,135,255,0.62);
    --sph-shd:    rgba(0,15,70,0.45);
    --cloud:      rgba(70,110,175,0.22);
    --fg:         rgba(195,228,255,0.95);
    --fg2:        rgba(135,188,240,0.72);
    --fg3:        rgba(145,198,250,0.82);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top:    #02080f;
  --sky-mid:    #05162e;
  --sky-low:    #0b2c50;
  --sph-hi:     rgba(90,155,228,0.52);
  --sph-mid:    rgba(35,85,175,0.32);
  --sph-dep:    rgba(8,45,125,0.62);
  --sph-glo:    rgba(55,135,255,0.62);
  --sph-shd:    rgba(0,15,70,0.45);
  --cloud:      rgba(70,110,175,0.22);
  --fg:         rgba(195,228,255,0.95);
  --fg2:        rgba(135,188,240,0.72);
  --fg3:        rgba(145,198,250,0.82);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
  font-family: 'Raleway', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}

.sun-haze {
  position: fixed;
  top: -60px; left: 50%;
  transform: translateX(-50%);
  width: 700px; max-width: 120vw; height: 320px;
  background: radial-gradient(ellipse at 50% 0%,
    rgba(255,235,110,0.07) 0%,
    rgba(120,200,255,0.03) 48%,
    transparent 72%
  );
  pointer-events: none;
  z-index: 0;
}

.stars-canvas {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  display: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .stars-canvas { display: block; }
}
:root[data-theme="dark"] .stars-canvas { display: block; }

.clouds-layer {
  position: fixed; inset: 0;
  overflow: hidden;
  pointer-events: none; z-index: 0;
}
.cloud { position: absolute; }
.puff  { position: absolute; background: var(--cloud); border-radius: 50%; }

@keyframes drift {
  0%   { transform: translate(0,                       0); }
  20%  { transform: translate(calc(var(--dx) * 0.4),  -6px); }
  50%  { transform: translate(var(--dx),               3px); }
  75%  { transform: translate(calc(var(--dx) * 0.7),  -4px); }
  100% { transform: translate(0,                       0); }
}

/* === Scene === */
.scene {
  position: relative; z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
  width: 100%;
}

.phase-word {
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--fg3);
  transition: color 0.8s ease;
  min-height: 16px;
  text-align: center;
}

.sphere-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56vw;
  height: 56vw;
  max-width: calc(100vw - 32px);
  max-height: calc(100vw - 32px);
  flex-shrink: 0;
}

/* Sphere transitions use --sphere-dur so JS can change them per phase */
.sphere-aura {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle,
    var(--sph-glo) 0%,
    rgba(100,180,255,0.07) 62%,
    transparent 80%
  );
  transition:
    width   var(--sphere-dur) cubic-bezier(0.42,0,0.58,1),
    height  var(--sphere-dur) cubic-bezier(0.42,0,0.58,1),
    opacity var(--sphere-dur) ease;
}

.sphere-body {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 27%,
    var(--sph-hi) 0%,
    rgba(255,255,255,0.26) 17%,
    var(--sph-mid) 46%,
    var(--sph-dep) 100%
  );
  border: 1.5px solid rgba(255,255,255,0.28);
  transition:
    width      var(--sphere-dur) cubic-bezier(0.42,0,0.58,1),
    height     var(--sphere-dur) cubic-bezier(0.42,0,0.58,1),
    box-shadow var(--sphere-dur) ease;
  will-change: width, height;
}

.sphere-body::after {
  content: '';
  position: absolute;
  width: 27%; height: 17%;
  top: 15%; left: 20%;
  background: rgba(255,255,255,0.46);
  border-radius: 50%;
  filter: blur(5px);
  pointer-events: none;
}

.sphere-body::before {
  content: '';
  position: absolute;
  width: 55%; height: 10%;
  bottom: 14%; left: 22%;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  filter: blur(6px);
  pointer-events: none;
}

.sphere-content {
  position: relative; z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  pointer-events: none;
}

.breath-count {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: clamp(22px, 9vw, 80px);
  font-weight: 100;
  line-height: 1;
  color: var(--fg);
  font-variant-numeric: lining-nums tabular-nums;
  min-width: 2ch;
  text-align: center;
  transition: opacity 0.2s ease;
}

.breath-micro {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--fg2);
  text-align: center;
}

/* Controls */
.controls-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.btn-breath {
  appearance: none;
  background: rgba(255,255,255,0.17);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 100px;
  padding: 12px 48px;
  font-family: 'Raleway', system-ui, sans-serif;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--fg);
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: background 0.2s, border-color 0.2s, transform 0.12s;
  outline: none;
  min-width: 150px;
}
.btn-breath:hover {
  background: rgba(255,255,255,0.27);
  border-color: rgba(255,255,255,0.44);
  transform: translateY(-1px);
}
.btn-breath:active { transform: scale(0.97) translateY(0); }
.btn-breath:focus-visible {
  outline: 2px solid rgba(255,255,255,0.55);
  outline-offset: 3px;
}

/* Pattern pills */
.pattern-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.pattern-btn {
  appearance: none;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 100px;
  padding: 6px 16px;
  font-family: 'Raleway', system-ui, sans-serif;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.18em;
  color: var(--fg2);
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
  outline: none;
  white-space: nowrap;
}
.pattern-btn:hover {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.3);
  color: var(--fg);
}
.pattern-btn:active { transform: scale(0.96); }
.pattern-btn.active {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.38);
  color: var(--fg);
  font-weight: 400;
}
.pattern-btn:focus-visible {
  outline: 2px solid rgba(255,255,255,0.5);
  outline-offset: 2px;
}

.session-info {
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.08em;
  color: var(--fg2);
  min-height: 16px;
  text-align: center;
}

.theme-toggle {
  position: fixed;
  top: max(16px, env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 10;
  appearance: none;
  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 50%;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background 0.2s, border-color 0.2s, transform 0.12s;
  color: var(--fg);
  padding: 0;
  outline: none;
}
.theme-toggle:hover {
  background: rgba(255,255,255,0.24);
  border-color: rgba(255,255,255,0.38);
  transform: scale(1.08);
}
.theme-toggle:active { transform: scale(0.95); }
.theme-toggle:focus-visible {
  outline: 2px solid rgba(255,255,255,0.55);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  .sphere-body, .sphere-aura { transition-duration: 0.4s !important; }
  .cloud { animation: none !important; }
  .breath-count { transition: none !important; }
}
</style>

<div class="sun-haze"></div>
<canvas class="stars-canvas" id="starsCanvas"></canvas>
<div class="clouds-layer" id="cloudsLayer"></div>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle day/night">
  <svg id="themeIcon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></svg>
</button>

<div class="scene">
  <div class="phase-word" id="phaseWord">5 · 5 Breathing</div>

  <div class="sphere-stage">
    <div class="sphere-aura" id="sphereAura" style="width:20vw;height:20vw;opacity:0.44"></div>
    <div class="sphere-body" id="sphereBody" style="width:15vw;height:15vw"></div>
    <div class="sphere-content">
      <div class="breath-count" id="breathCount">5</div>
      <div class="breath-micro" id="breathMicro">begin when ready</div>
    </div>
  </div>

  <div class="controls-area">
    <button class="btn-breath" id="btnMain">Begin</button>
    <div class="pattern-row" id="patternRow">
      <button class="pattern-btn active" data-idx="0">5 · 5</button>
      <button class="pattern-btn"        data-idx="1">4 · 6</button>
      <button class="pattern-btn"        data-idx="2">4 · 8</button>
    </div>
    <div class="session-info" id="sessionInfo">inhale 5s · exhale 5s</div>
  </div>
</div>

<script>
(function () {
  const patterns = [
    { label: '5 · 5', inhale: 5, exhale: 5 },
    { label: '4 · 6', inhale: 4, exhale: 6 },
    { label: '4 · 8', inhale: 4, exhale: 8 },
  ];
  let patIdx = 0;

  /* ── Stars ── */
  const starCanvas = document.getElementById('starsCanvas');
  function drawStars() {
    const W = starCanvas.width  = window.innerWidth;
    const H = starCanvas.height = window.innerHeight;
    const ctx = starCanvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    const n = Math.floor(W * H / 2800);
    for (let i = 0; i < n; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H * 0.65;
      const r = Math.random() * 1.1 + 0.3;
      const a = Math.random() * 0.55 + 0.2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(215,232,255,${a.toFixed(2)})`;
      ctx.fill();
    }
  }
  drawStars();
  window.addEventListener('resize', drawStars);

  /* ── Clouds ── */
  const cloudDefs = [
    { pos:{top:'7%',left:'1%'},      dx: 55, op:0.92, puffs:[[72,56,20,0],[92,74,0,40],[68,52,22,102]], base:[178,30] },
    { pos:{top:'19%',right:'0%'},    dx:-68, op:0.75, puffs:[[55,42,18,0],[76,62,0,30],[54,42,18,82]],  base:[140,26] },
    { pos:{top:'4%',left:'40%'},     dx: 40, op:0.52, puffs:[[44,34,13,0],[58,48,0,24],[42,34,14,65]],  base:[108,20] },
    { pos:{bottom:'24%',left:'0%'},  dx: 50, op:0.42, puffs:[[60,46,16,0],[80,64,0,34],[60,46,16,88]],  base:[155,26] },
    { pos:{bottom:'32%',right:'2%'}, dx:-58, op:0.35, puffs:[[50,38,14,0],[66,54,0,28],[50,38,14,74]],  base:[130,22] },
  ];
  const durs = [22,30,38,44,32];
  const dels = [0,4,11,2,16];
  const layer = document.getElementById('cloudsLayer');
  cloudDefs.forEach((cd, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'cloud';
    Object.assign(wrap.style, cd.pos);
    wrap.style.setProperty('--dx', cd.dx + 'px');
    wrap.style.animation = `drift ${durs[i]}s ease-in-out ${dels[i]}s infinite`;
    wrap.style.opacity = cd.op;
    const base = document.createElement('div');
    base.className = 'puff';
    Object.assign(base.style, { width:cd.base[0]+'px', height:cd.base[1]+'px', bottom:'0', left:'0', filter:'blur(16px)' });
    wrap.appendChild(base);
    cd.puffs.forEach(([w,h,t,l]) => {
      const p = document.createElement('div');
      p.className = 'puff';
      Object.assign(p.style, { width:w+'px', height:h+'px', top:t+'px', left:l+'px', filter:'blur(9px)' });
      wrap.appendChild(p);
    });
    layer.appendChild(wrap);
  });

  /* ── Breathing engine ── */
  const aura    = document.getElementById('sphereAura');
  const sph     = document.getElementById('sphereBody');
  const countEl = document.getElementById('breathCount');
  const microEl = document.getElementById('breathMicro');
  const wordEl  = document.getElementById('phaseWord');
  const btn     = document.getElementById('btnMain');
  const infoEl  = document.getElementById('sessionInfo');
  const root    = document.documentElement;

  let running = false, phase = 'rest', tick = 0, cycles = 0;
  let timerId = null, fadeTimer = null;

  const SIZES = {
    rest:   { s: '15vw', a: '20vw', aOp: 0.44 },
    inhale: { s: '50vw', a: '58vw', aOp: 0.72 },
    exhale: { s: '15vw', a: '20vw', aOp: 0.44 },
  };
  const SH_INHALE = '0 22px 72px var(--sph-shd),0 0 95px var(--sph-glo),inset 3px -3px 20px rgba(255,255,255,0.22)';
  const SH_REST   = '0 8px 32px var(--sph-shd),0 0 28px rgba(100,180,255,0.18),inset 2px -2px 10px rgba(255,255,255,0.14)';

  function setDur(s) { root.style.setProperty('--sphere-dur', s + 's'); }

  function applySize(ph) {
    const z = SIZES[ph];
    sph.style.width  = sph.style.height  = z.s;
    aura.style.width = aura.style.height = z.a;
    aura.style.opacity   = z.aOp;
    sph.style.boxShadow  = ph === 'inhale' ? SH_INHALE : SH_REST;
  }

  function getCount() {
    const p = patterns[patIdx];
    if (phase === 'inhale') return tick;
    if (phase === 'exhale') return p.exhale + 1 - tick;
    return p.inhale;
  }

  function fadeCount(val) {
    if (fadeTimer) clearTimeout(fadeTimer);
    countEl.style.opacity = '0';
    fadeTimer = setTimeout(() => {
      countEl.textContent = val;
      countEl.style.opacity = '1';
      fadeTimer = null;
    }, 160);
  }

  function render(fade = true) {
    const val = getCount();
    if (fade) {
      fadeCount(val);
    } else {
      if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
      countEl.style.opacity = '1';
      countEl.textContent = val;
    }
    if (phase === 'inhale') { wordEl.textContent = 'Inhale'; microEl.textContent = 'breathe in';  }
    if (phase === 'exhale') { wordEl.textContent = 'Exhale'; microEl.textContent = 'breathe out'; }
  }

  function step() {
    tick++;
    const p = patterns[patIdx];
    const dur = phase === 'inhale' ? p.inhale : p.exhale;
    if (tick > dur) {
      tick = 1;
      if (phase === 'exhale') {
        cycles++;
        infoEl.textContent = cycles === 1 ? '1 cycle complete' : `${cycles} cycles complete`;
      }
      phase = phase === 'inhale' ? 'exhale' : 'inhale';
      setDur(phase === 'inhale' ? p.inhale : p.exhale);
      applySize(phase);
    }
    render();
  }

  function resetUI(p) {
    countEl.style.opacity = '1';
    countEl.textContent   = p.inhale;
    microEl.textContent   = 'begin when ready';
    wordEl.textContent    = p.label + ' Breathing';
    infoEl.textContent    = `inhale ${p.inhale}s · exhale ${p.exhale}s`;
    btn.textContent       = 'Begin';
  }

  function start() {
    const p = patterns[patIdx];
    running = true; phase = 'inhale'; tick = 1; cycles = 0;
    setDur(p.inhale);
    applySize('inhale');
    render(false);
    btn.textContent   = 'Stop';
    infoEl.textContent = `inhale ${p.inhale}s · exhale ${p.exhale}s`;
    timerId = setInterval(step, 1000);
  }

  function stop() {
    running = false;
    clearInterval(timerId); timerId = null;
    if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
    phase = 'rest'; tick = 0; cycles = 0;
    setDur(3); // gentle return animation
    applySize('rest');
    resetUI(patterns[patIdx]);
  }

  btn.addEventListener('click', () => running ? stop() : start());

  /* ── Pattern picker ── */
  document.getElementById('patternRow').addEventListener('click', e => {
    const pb = e.target.closest('.pattern-btn');
    if (!pb) return;
    const idx = +pb.dataset.idx;
    if (idx === patIdx) return;
    if (running) stop();
    patIdx = idx;
    document.querySelectorAll('.pattern-btn').forEach((b, i) =>
      b.classList.toggle('active', i === idx)
    );
    resetUI(patterns[patIdx]);
  });

  /* ── Init ── */
  setDur(5);
  applySize('rest');

  /* ── Day/night toggle ── */
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon   = document.getElementById('themeIcon');
  const MOON_PATH = '<path d="M14 10A6 6 0 0 1 8 16 6 6 0 0 1 2 10 6 6 0 0 1 8 4c-.4 1-.6 2-.6 3A5.6 5.6 0 0 0 13 13c-.4-.3.4-3 1-3z"/>';
  const SUN_PATHS = [
    '<circle cx="9" cy="9" r="3.2"/>',
    '<line x1="9" y1="1.5" x2="9" y2="3"/>',
    '<line x1="9" y1="15" x2="9" y2="16.5"/>',
    '<line x1="1.5" y1="9" x2="3" y2="9"/>',
    '<line x1="15" y1="9" x2="16.5" y2="9"/>',
    '<line x1="3.6" y1="3.6" x2="4.6" y2="4.6"/>',
    '<line x1="13.4" y1="13.4" x2="14.4" y2="14.4"/>',
    '<line x1="14.4" y1="3.6" x2="13.4" y2="4.6"/>',
    '<line x1="4.6" y1="13.4" x2="3.6" y2="14.4"/>',
  ].join('');

  function isDark() {
    const t = document.documentElement.dataset.theme;
    if (t === 'dark')  return true;
    if (t === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function updateThemeIcon() {
    themeIcon.innerHTML = isDark() ? SUN_PATHS : MOON_PATH;
    themeToggle.setAttribute('aria-label', isDark() ? 'Switch to day' : 'Switch to night');
  }
  (function initTheme() {
    try {
      const saved = localStorage.getItem('breathspace-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.dataset.theme = saved;
      }
    } catch(e) {}
    updateThemeIcon();
  })();
  themeToggle.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('breathspace-theme', next); } catch(e) {}
    updateThemeIcon();
  });

  /* ── Service worker (PWA) ── */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
})();
</script>
